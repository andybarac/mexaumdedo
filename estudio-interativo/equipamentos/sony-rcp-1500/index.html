<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sony RCP-1500 — painel interativo</title><style>
:root{--bg:#0f1317;--panel:#151a1f;--card:#20262d;--line:#3d464f;--text:#f4f6f7;--muted:#adb5bd;--accent:#64a8ff;--accentbg:#173451;--green:#66df76;--amber:#f3b33d;--red:#ef4f49}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif}main{max-width:1080px;margin:auto;padding:18px}.muted{color:var(--muted);line-height:1.6}.frame{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#12171b;padding:14px}.frame svg{width:100%;min-width:620px;max-height:1100px}.toolbar{display:flex;justify-content:flex-end;margin:10px 0}.btn,.sim{background:transparent;color:var(--text);border:1px solid #4a545d;border-radius:8px;padding:9px 12px;cursor:pointer}.sim.active{background:var(--accentbg);border-color:var(--accent);font-weight:600}.spot{cursor:pointer;outline:none}.hit{fill:transparent;stroke:transparent;stroke-width:3}.spot.selected .hit{stroke:var(--accent);fill:var(--accentbg);fill-opacity:.12}.lesson{margin-top:14px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.copy{font-size:14px;line-height:1.6}.modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.feedback{margin-top:12px;background:var(--panel);border-radius:9px;padding:12px;font-size:14px;line-height:1.55}.tiny{font-size:7px;fill:#23292d;text-anchor:middle;pointer-events:none}.micro{font-size:6px;fill:#3a4247;text-anchor:middle;pointer-events:none}.led{transition:fill .15s,filter .15s}.on{fill:var(--green);filter:drop-shadow(0 0 4px var(--green))}.off{fill:#8e9699}.amber{fill:var(--amber);filter:drop-shadow(0 0 4px var(--amber))}.red{fill:var(--red);filter:drop-shadow(0 0 4px var(--red))}.blink{animation:blink .55s steps(1,end) infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.blink{animation:none}}
</style></head><body><main>

<circle cx="310" cy="1114" r="72" fill="#d4d8d8" stroke="#777f82" stroke-width="3"/><circle cx="310" cy="1114" r="51" fill="url(#knob)" stroke="#7f8789"/><circle id="joy" cx="310" cy="1114" r="13" fill="#80878a"/><line x1="310" y1="1084" x2="310" y2="1098" stroke="#444" stroke-width="2"/><text x="310" y="1204" class="micro">IRIS / MASTER BLACK</text>

<section class="lesson" aria-live="polite"><h2 id="title">Controle de câmera</h2><div id="term" class="muted">(Camera / Panel Control)</div>
<div class="grid" style="margin-top:16px"><div><div class="ey">Como funciona</div><p id="func" class="copy"></p></div><div><div class="ey">Exemplo de uso</div><p id="example" class="copy"></p></div></div>
<div class="ey">Experimente</div><div id="modes" class="modes"></div><div id="feedback" class="feedback"></div></section>

<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const st={camPower:true,bars:false,std:false,nd:1,cc:'A',shutter:'OFF',gain:0,iris:5.6,mb:0,panel:true,tally:'amber',scene:1,menu:'STATUS'};
function led(id,c){$(id).setAttribute('class','led '+c)}
function menu(title,a,b,c){$('#lcdTitle').textContent=title;$('#lcd1').textContent=a||'';$('#lcd2').textContent=b||'';$('#lcd3').textContent=c||''}
const L={
top:{t:'Controle de câmera e painel',term:'Camera / Panel Control',f:'O bloco superior concentra funções essenciais como alimentação da câmera, barras, padrão de referência, controle paralelo e ajustes rápidos.',e:'Antes de operar uma câmera, confirme CAM PW. Use BARS para enviar barras quando precisar testar o caminho de vídeo e STANDARD para recuperar uma condição de referência.',m:[['CAM PW',()=>{st.camPower=!st.camPower;led('#camLed',st.camPower?'on':'off')},'A alimentação da câmera foi alternada.'],['BARS',()=>{st.bars=!st.bars;led('#barsLed',st.bars?'on':'off');menu(st.bars?'COLOR BARS':'STATUS',st.bars?'Saída de teste ativa':'CAM 1','1080i59.94','IRIS F'+st.iris)},'A saída de barras foi alternada.'],['STANDARD',()=>{st.std=true;led('#stdLed','on');st.nd=1;st.cc='A';st.gain=0;st.mb=0;$('#ndDisp').textContent='1';$('#ccDisp').textContent='A';$('#gainDisp').textContent='0';$('#mbDisp').textContent='0'},'A câmera voltou aos valores padrão configurados.']]},
menu:{t:'LCD e menus',term:'LCD / SELECT / MENU / CUSTOM',f:'A tela sensível ao toque e os encoders permitem navegar pelos menus, selecionar itens e ajustar valores.',e:'Durante uma aula, use STATUS para conferir rapidamente o estado da câmera e PAINT para demonstrar como os parâmetros de imagem são organizados.',m:[['STATUS',()=>menu('STATUS','CAM 1','1080i59.94','IRIS F'+st.iris),'A tela mostra o estado geral.'],['PAINT',()=>menu('PAINT','WHITE / BLACK','DETAIL / GAMMA','SATURATION'),'O menu de paint foi aberto.'],['CUSTOM',()=>menu('CUSTOM','1  WHITE','2  DETAIL','3  SKIN DETAIL'),'O menu personalizado foi aberto.']]},
function:{t:'Filtros, shutter e ganho',term:'ND / CC / Shutter / Master Gain',f:'Esse bloco reúne controles usados constantemente para exposição, filtragem óptica e sensibilidade da câmera.',e:'Em um cenário muito claro, aumente o ND antes de fechar demais a íris. Em pouca luz, o master gain pode ajudar, mas também aumenta o ruído.',m:[['ND +',()=>{st.nd=Math.min(5,st.nd+1);$('#ndDisp').textContent=st.nd},'O filtro ND avançou uma posição.'],['ND −',()=>{st.nd=Math.max(1,st.nd-1);$('#ndDisp').textContent=st.nd},'O filtro ND recuou uma posição.'],['Shutter',()=>{st.shutter=st.shutter==='OFF'?'1/100':'OFF';$('#shutDisp').textContent=st.shutter},'O shutter foi alternado.'],['Gain +',()=>{st.gain=Math.min(12,st.gain+3);$('#gainDisp').textContent=st.gain},'O ganho foi aumentado.'],['Gain −',()=>{st.gain=Math.max(-6,st.gain-3);$('#gainDisp').textContent=st.gain},'O ganho foi reduzido.']]},
paint:{t:'Ajustes de paint',term:'White / Black / Flare / Detail',f:'Os controles de paint ajustam os componentes R, G e B do branco e do preto, além de detail e um parâmetro atribuível.',e:'Ao casar duas câmeras, pequenos ajustes de white e black ajudam a aproximar cor e neutralidade entre elas sem mexer no enquadramento ou exposição.',m:[['Mais vermelho no white',()=>{menu('PAINT','WHITE R +3','WHITE G 0','WHITE B 0')},'O ganho do vermelho no branco foi elevado.'],['Black balance',()=>{menu('PAINT','BLACK R -1','BLACK G 0','BLACK B +1')},'O balanço de preto foi alterado.'],['Detail +',()=>{menu('PAINT','DETAIL +5','','')},'O nível de detail foi aumentado.']]},
iris:{t:'Íris e master black',term:'Iris / Master Black Joystick',f:'O joystick combina dois ajustes fundamentais. O movimento vertical controla a íris e o giro controla master black. O painel também mostra número da câmera, tally e valores atuais.',e:'Durante um programa, use a íris para manter exposição consistente entre câmeras. Master black ajusta o nível de preto sem alterar o branco.',m:[['Abrir íris',()=>{st.iris=Math.max(1.4,+(st.iris-.4).toFixed(1));$('#irisDisp').textContent=st.iris.toFixed(1);$('#joy').setAttribute('cy','1105')},'A íris foi aberta e a imagem receberia mais luz.'],['Fechar íris',()=>{st.iris=Math.min(16,+(st.iris+.4).toFixed(1));$('#irisDisp').textContent=st.iris.toFixed(1);$('#joy').setAttribute('cy','1123')},'A íris foi fechada e a imagem receberia menos luz.'],['Master black +',()=>{st.mb=Math.min(99,st.mb+2);$('#mbDisp').textContent=st.mb;$('#joy').setAttribute('cx','319')},'O nível de preto foi elevado.'],['Master black −',()=>{st.mb=Math.max(-99,st.mb-2);$('#mbDisp').textContent=st.mb;$('#joy').setAttribute('cx','301')},'O nível de preto foi reduzido.'],['Tally vermelho',()=>{$('#camNum').setAttribute('fill','#ef4f49');$('#camNumTxt').setAttribute('fill','#111')},'A câmera aparece com tally vermelho.'],['Tally verde',()=>{$('#camNum').setAttribute('fill','#66df76');$('#camNumTxt').setAttribute('fill','#111')},'A câmera aparece com tally verde.']]},
};
function show(k){const l=L[k];$$('.spot').forEach(s=>s.classList.toggle('selected',s.dataset.key===k));$('#title').textContent=l.t;$('#term').textContent='('+l.term+')';$('#func').textContent=l.f;$('#example').textContent=l.e;const box=$('#modes');box.innerHTML='';l.m.forEach(m=>{const b=document.createElement('button');b.className='sim';b.textContent=m[0];b.onclick=()=>{[...box.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');m[1]();$('#feedback').textContent=m[2]};box.appendChild(b)})}
function reset(){Object.assign(st,{camPower:true,bars:false,std:false,nd:1,cc:'A',shutter:'OFF',gain:0,iris:5.6,mb:0,panel:true,tally:'amber',scene:1,menu:'STATUS'});led('#camLed','on');led('#barsLed','off');led('#stdLed','off');$('#ndDisp').textContent='1';$('#ccDisp').textContent='A';$('#shutDisp').textContent='OFF';$('#gainDisp').textContent='0';$('#irisDisp').textContent='5.6';$('#mbDisp').textContent='0';$('#camNum').setAttribute('fill','#171b1e');$('#camNumTxt').setAttribute('fill','#f3b33d');$('#joy').setAttribute('cx','310');$('#joy').setAttribute('cy','1114');menu('STATUS','CAM 1','1080i59.94','IRIS F5.6');show('top')}
$$('.spot').forEach(s=>s.onclick=()=>show(s.dataset.key));$('#reset').onclick=reset;reset()})();
</script></main></body></html>
